# Автоматические PR на обновление зависимостей. Раз в неделю; секьюрити-апдейты
# Dependabot присылает сразу, независимо от расписания.
version: 2
updates:
  # фронтенд: maplibre-gl и h3-js попадают в поставляемый bundle.js,
  # поэтому за ними следим в первую очередь; esbuild — только сборка
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # мелкие обновления одним PR, мажорные — по отдельности, они ломающие
      npm-minor-patch:
        update-types: [minor, patch]

  # бэкенд: сейчас зависимостей вне стандартной библиотеки нет,
  # но правило нужно на будущее и ловит обновления самого Go-модуля
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "deps"

  # версии GitHub Actions (checkout, setup-node, setup-go, action-gh-release)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "ci"
