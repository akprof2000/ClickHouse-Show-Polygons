# Релиз по тегу vX.Y.Z: сборка под Windows с иконкой + инсталлятор Inno Setup
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # web/vendor/Demo-H3-Hex — сетка H3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка фронтенда
        working-directory: web
        run: |
          npm ci
          npm run build
          cp index.html dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Иконка и версия в ресурсы Windows
        run: |
          VER="${GITHUB_REF_NAME#v}"
          go run github.com/tc-hib/go-winres@latest make \
            --file-version "$VER" --product-version "$VER"

      - name: Сборка chviewer.exe
        run: |
          VER="${GITHUB_REF_NAME#v}"
          go build -ldflags "-s -w -X main.version=$VER" -o chviewer.exe .

      - name: Сборка инсталлятора (Inno Setup)
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver /O. installer.iss

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: |
            chviewer.exe
            ClickHouse-Show-Polygons-Setup-*.exe
          generate_release_notes: true
