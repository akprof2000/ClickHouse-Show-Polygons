# Релиз серверного приложения: основной артефакт — tar.gz под Linux (CentOS 9
# и совместимые) со скриптом запуска и systemd-юнитом; дополнительно zip под
# Windows для локального запуска. MSI-инсталлятора больше нет: он ставил
# настольную версию с ярлыками, а служба так не разворачивается.
# Запускается по тегу vX.Y.Z либо вручную (Actions → release → Run workflow),
# при ручном запуске тег создаётся сам из файла VERSION.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия X.Y.Z (пусто — берётся из файла VERSION)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # web/vendor/Demo-H3-Hex — сетка H3

      - name: Версия и тег релиза
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VER="${INPUT_VERSION#v}"
          else
            VER="$(tr -d ' \t\r\n' < VERSION)"
          fi
          echo "VER=$VER"   >> "$GITHUB_ENV"
          echo "TAG=v$VER"  >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка фронтенда
        working-directory: web
        run: |
          npm ci
          npm run build
          cp index.html dist/

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Сборка под Linux (основной артефакт)
        run: |
          # статическая сборка: работает на CentOS 9 и любом другом дистрибутиве
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=$VER" -o chviewer .
          PKG="chviewer-$VER-linux-amd64"
          mkdir -p "$PKG"
          cp chviewer scripts/launch/serve.sh README.md LICENSE "$PKG/"
          cp scripts/systemd/chviewer.service "$PKG/"
          ./chviewer -config "$PKG/chviewer.yaml.example" -init
          chmod +x "$PKG/chviewer" "$PKG/serve.sh"
          tar czf "ClickHouse-Show-Polygons-$VER-linux-amd64.tar.gz" "$PKG"

      - name: Сборка под Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=$VER" -o chviewer.exe .
          zip -q "ClickHouse-Show-Polygons-$VER-windows-amd64.zip" chviewer.exe README.md LICENSE

      - name: Публикация релиза
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ClickHouse-Show-Polygons-*-linux-amd64.tar.gz
            ClickHouse-Show-Polygons-*-windows-amd64.zip
          generate_release_notes: true

      # храним только один релиз: все предыдущие (и их теги) удаляются
      - name: Удаление старых релизов
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --json tagName -q '.[].tagName' |
          while read -r tag; do
            if [ "$tag" != "$TAG" ]; then
              echo "удаляю релиз $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
