# Релиз: сборка под Windows с иконкой, portable-zip и MSI-инсталлятор (WiX).
# Запускается по тегу vX.Y.Z либо вручную (Actions → release → Run workflow),
# при ручном запуске тег создаётся сам из файла VERSION.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия X.Y.Z (пусто — берётся из файла VERSION)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # web/vendor/Demo-H3-Hex — сетка H3

      - name: Версия и тег релиза
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VER="${INPUT_VERSION#v}"
          else
            VER="$(tr -d ' \t\r\n' < VERSION)"
          fi
          echo "VER=$VER"   >> "$GITHUB_ENV"
          echo "TAG=v$VER"  >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка фронтенда
        working-directory: web
        run: |
          npm ci
          npm run build
          cp index.html dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Иконка и версия в ресурсы Windows
        run: |
          go run github.com/tc-hib/go-winres@latest make \
            --file-version "$VER" --product-version "$VER"

      - name: Сборка chviewer.exe
        run: |
          go build -ldflags "-s -w -X main.version=$VER" -o chviewer.exe .

      - name: Упаковка chviewer.exe в zip
        run: |
          7z a -tzip "ClickHouse-Show-Polygons-$VER-portable.zip" chviewer.exe README.md LICENSE

      - name: Сборка MSI-инсталлятора (WiX)
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build -arch x64 -d AppVersion="$VER" \
            -o "ClickHouse-Show-Polygons-$VER.msi" installer.wxs

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ClickHouse-Show-Polygons-*-portable.zip
            ClickHouse-Show-Polygons-*.msi
          generate_release_notes: true

      # храним только один релиз: все предыдущие (и их теги) удаляются
      - name: Удаление старых релизов
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --json tagName -q '.[].tagName' |
          while read -r tag; do
            if [ "$tag" != "$TAG" ]; then
              echo "удаляю релиз $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done
