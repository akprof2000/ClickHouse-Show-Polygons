# Релиз серверного приложения.
#
# Как выпустить версию — одним из трёх способов:
#   1. Поменять файл VERSION и запушить в master. Релиз vX.Y.Z соберётся сам;
#      если такой тег уже есть, ничего не произойдёт (повторно не выпускаем).
#   2. Запушить тег vX.Y.Z.
#   3. Вручную: Actions → release → Run workflow (версия из поля или VERSION).
#
# Перед сборкой прогоняются все проверки из ci.yml, включая test.sh против
# настоящего ClickHouse: релиз со сломанной логикой не выйдет.
#
# Артефакты: tar.gz под Linux (CentOS 9 и совместимые) со скриптом запуска,
# systemd-юнитом и примером конфигурации; zip под Windows для локального
# запуска; SHA256SUMS.txt для проверки скачанного на сервере.
# Сколько релизов хранить, решает prune-releases.yml (три последних).
name: release

on:
  push:
    branches: [master]
    paths: [VERSION]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия X.Y.Z (пусто — берётся из файла VERSION)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # решаем, выпускать ли вообще и какую версию
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VER="${INPUT_VERSION#v}"
          else
            VER="$(tr -d ' \t\r\n' < VERSION)"
          fi
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::версия «$VER» не похожа на X.Y.Z"
            exit 1
          fi
          PUBLISH=true
          # при смене VERSION в master: если релиз уже есть — не повторяем
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_EVENT_NAME" = "push" ] &&
             gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::релиз v$VER уже существует — пропускаю"
            PUBLISH=false
          fi
          echo "version=$VER"     >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "версия: $VER, выпускать: $PUBLISH"

  test:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [plan, test]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # web/vendor/Demo-H3-Hex — сетка H3

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка фронтенда
        working-directory: web
        run: |
          npm ci
          npm run build
          cp index.html dist/

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Сборка под Linux (основной артефакт)
        run: |
          # статическая сборка: работает на CentOS 9 и любом другом дистрибутиве
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=$VER" -o chviewer .
          PKG="chviewer-$VER-linux-amd64"
          mkdir -p "$PKG"
          cp chviewer scripts/launch/serve.sh README.md LICENSE "$PKG/"
          cp scripts/systemd/chviewer.service "$PKG/"
          ./chviewer -config "$PKG/chviewer.yaml.example" -init
          chmod +x "$PKG/chviewer" "$PKG/serve.sh"
          tar czf "ClickHouse-Show-Polygons-$VER-linux-amd64.tar.gz" "$PKG"

      - name: Сборка под Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=$VER" -o chviewer.exe .
          zip -q "ClickHouse-Show-Polygons-$VER-windows-amd64.zip" chviewer.exe README.md LICENSE

      - name: Контрольные суммы
        run: sha256sum ClickHouse-Show-Polygons-*.tar.gz ClickHouse-Show-Polygons-*.zip > SHA256SUMS.txt

      - name: Публикация релиза
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ClickHouse-Show-Polygons-*-linux-amd64.tar.gz
            ClickHouse-Show-Polygons-*-windows-amd64.zip
            SHA256SUMS.txt
          generate_release_notes: true
