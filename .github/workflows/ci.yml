# Проверка сборки на каждый push: фронтенд (esbuild) + бэкенд (go vet, go build)
name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка фронтенда
        working-directory: web
        run: |
          npm ci
          npm run build
          cp index.html dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Проверка и сборка бэкенда
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o chviewer.exe .
