# Проверка сборки на каждый push: фронтенд (esbuild) + бэкенд (go vet, go build)
name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Установка зависимостей фронтенда
        working-directory: web
        run: npm ci

      # Проверка зависимостей на известные уязвимости. Падаем на high и critical:
      # maplibre-gl и h3-js попадают в поставляемый bundle.js, поэтому их
      # уязвимости — это уязвимости продукта, а не только сборочной машины.
      - name: Аудит зависимостей (npm audit)
        working-directory: web
        run: npm audit --audit-level=high

      - name: Сборка фронтенда
        working-directory: web
        run: |
          npm run build
          cp index.html dist/

      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'

      - name: Проверка и сборка бэкенда
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o chviewer.exe .
